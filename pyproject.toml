[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cc2agy"
version = "0.2.0"
description = "Bridge and migration tool from Claude Code (commands, skills, MCP, rules) to Google Antigravity"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "cc2agy Contributors" }
]
keywords = [
    "claude-code",
    "antigravity",
    "gemini",
    "skills",
    "mcp",
    "migration",
    "bridge",
    "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities"
]

[project.scripts]
cc2agy = "cc2agy.cli:main"

[project.urls]
Homepage = "https://github.com/azsak00/cc2agy"
Repository = "https://github.com/azsak00/cc2agy.git"
"Bug Tracker" = "https://github.com/azsak00/cc2agy/issues"

[tool.setuptools.packages.find]
where = ["src"]
